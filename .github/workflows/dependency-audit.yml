name: Dependency audit

on:
  push:
    branches: [enhanced]
    paths:
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit lockfile
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          status=$?
          set -e
          if [ "$status" -gt 1 ] || ! node -e "const a=require('./npm-audit.json'); if (!a.metadata?.vulnerabilities) process.exit(1)"; then
            echo 'Audit could not be completed; see the artifact for details.'
            exit 1
          fi
          node -e "const v=require('./npm-audit.json').metadata.vulnerabilities; console.log('Audit completed. Total:', v.total, '| Critical:', v.critical, '| High:', v.high, '| Moderate:', v.moderate, '| Low:', v.low)"
      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 7
